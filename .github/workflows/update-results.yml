name: Update World Cup results

on:
  workflow_dispatch:
  schedule:
    # Runs every 2 hours. GitHub Actions uses UTC time.
    - cron: "0 */2 * * *"

permissions:
  contents: write

jobs:
  update-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update results.json from API-Football
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node scripts/update-results.mjs

      - name: Commit updated results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add results.json
          git diff --staged --quiet || git commit -m "Update World Cup results"
          git push
