name: Update World Cup results

on:
  workflow_dispatch:
  schedule:
    # Runs every 4 hours. GitHub Actions uses UTC time.
    - cron: "0 */4 * * *"

permissions:
  contents: write

jobs:
  update-results:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update results.json from football-data.org
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: node scripts/update-results.mjs

      - name: Commit updated results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add results.json
          git diff --staged --quiet || git commit -m "Update World Cup results"
          git push
